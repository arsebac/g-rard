services:
  app:
    # Using the 'main' tag which matches your GitHub branch push
    image: ghcr.io/arsebac/g-rard:main
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gerard-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Update these with your actual host MariaDB credentials
      # 'host.docker.internal' refers to your Raspberry Pi host
      DATABASE_URL: mysql://gerard:gerard_password@host.docker.internal:3306/gerard
      SESSION_SECRET: changeme_use_a_random_32_char_string
      UPLOAD_DIR: /app/uploads
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - gerard_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  gerard_uploads:
