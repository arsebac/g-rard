services:
  app:
    image: ghcr.io/arsebac/g-rard:main
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gerard-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      UPLOAD_DIR: ${UPLOAD_DIR}
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      GERARD_API_KEY: ${GERARD_API_KEY}
    volumes:
      - gerard_uploads:/app/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.gerard.rule=Host(`gerard.local`) || Host(`mcp.gerard.local`)"
      - "traefik.http.routers.gerard.entrypoints=web"
      - "traefik.http.services.gerard.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  proxy:
    external: true

volumes:
  gerard_uploads:
