services:
  app:
    image: ghcr.io/arsebac/g-rard:main
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gerard-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy
    environment:
      DATABASE_URL: mysql://gerard:gerard_password@host.docker.internal:3306/gerard
      SESSION_SECRET: changeme_use_a_random_32_char_string
      UPLOAD_DIR: /app/uploads
      PORT: 3000
      NODE_ENV: production
    volumes:
      - gerard_uploads:/app/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gerard.rule=Host(`gerard.local`)"
      - "traefik.http.routers.gerard.entrypoints=web"
      - "traefik.http.services.gerard.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  proxy:
    external: true

volumes:
  gerard_uploads:
